# ===========================
# Default (Common) Settings
# ===========================
spring:
  config:
    activate:
      on-profile: dev  # Default profile (optional, for clarity)
  application:
    name: api-gateway

server:
  port: 8080

cloud:
  gateway:
    routes:
      - id: user-service
        uri: lb://USER-SERVICE
        predicates:
          - Path=/user/**
      - id: appointment-service
        uri: lb://APPOINTMENT-SERVICE
        predicates:
          - Path=/appointment/**

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8000/eureka
    register-with-eureka: true
    fetch-registry: true

---

# ===========================
# Dev Profile Configuration
# ===========================
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://localhost:3306/devdb
    username: devuser
    password: devpassword

---

# ===========================
# SIT Profile Configuration
# ===========================
spring:
  config:
    activate:
      on-profile: sit
  application:
    name: api-gateway
  server:
    port: 8081
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://USER-SERVICE-SIT
          predicates:
            - Path=/user/**
        - id: appointment-service
          uri: lb://APPOINTMENT-SERVICE-SIT
          predicates:
            - Path=/appointment/**
  eureka:
    client:
      serviceUrl:
        defaultZone: http://sit-eureka-server:8000/eureka
  datasource:
    url: jdbc:mysql://localhost:3306/sitdb
    username: situser
    password: sitpassword

---

# ===========================
# Prod Profile Configuration
# ===========================
spring:
  config:
    activate:
      on-profile: prod
  application:
    name: api-gateway
  server:
    port: 8082
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://USER-SERVICE-PROD
          predicates:
            - Path=/user/**
        - id: appointment-service
          uri: lb://APPOINTMENT-SERVICE-PROD
          predicates:
            - Path=/appointment/**
  eureka:
    client:
      serviceUrl:
        defaultZone: http://prod-eureka-server:8000/eureka
  datasource:
    url: jdbc:mysql://localhost:3306/proddb
    username: produser
    password: prodpassword
